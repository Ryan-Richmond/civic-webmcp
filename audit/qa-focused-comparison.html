<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civic budget-canvas comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #20201e; color: #f4f1e8; font: 14px system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; }
    img { display: block; width: 100%; height: auto; border: 1px solid #555; background: #f7f5ef; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Source budget canvas</figcaption><img src="/audit/source-instrument-budget-focus.png" alt="Selected Instrument budget canvas" /></figure>
    <figure><figcaption>Implemented budget canvas at 1280 × 720</figcaption><img src="/audit/implementation-budget-focus.png" alt="Implemented Civic budget canvas" /></figure>
  </main>
</body>
</html>
