<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Civic baseline design comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #20201e; color: #f4f1e8; font: 14px system-ui, sans-serif; }

    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; }
    img { display: block; width: 100%; height: auto; border: 1px solid #555; background: #f7f5ef; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Source: selected Instrument design</figcaption><img src="/audit/source-instrument-baseline-crop.png" alt="Selected Instrument design baseline" /></figure>
    <figure><figcaption>Implementation: 1280 × 720 baseline</figcaption><img src="/audit/implementation-baseline-1280x720.png" alt="Implemented Civic baseline" /></figure>
  </main>
</body>
</html>
